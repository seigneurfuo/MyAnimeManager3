name: Package application with Pyinstaller

on:
  push:
    tags:
      - '202*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Get latest commit date on branch
      run: |
        # Get the commit date on the current branch
        LATEST_COMMIT_DATE=$(git show -s --format=%cd --date=format:"%Y.%m.%d")
        echo "LATEST_COMMIT_DATE=${LATEST_COMMIT_DATE}" >> $GITHUB_ENV
        echo "Latest commit date: ${LATEST_COMMIT_DATE}"

    - name: Changing DEV version to latest commit date
      run: sed -i "s/^app_version = \"DEV\"$/app_version = \"$LATEST_COMMIT_DATE\"/" "src/core.py"

    - name: Installing dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pyinstaller pillow

    - name: Converting png icon to ico
      run: python -c "from PIL import Image; Image.open('src/resources/icon.png').save('src/resources/icon.ico', sizes=[(s, s) for s in (256, 128, 96, 64, 48, 32, 16)])"

    - name: Packaging application
      run: pyinstaller --noconfirm --distpath dist/windows .pyinstaller.spec

    - name: Creating zip before upload to release
      run: |
        cd dist/windows/MyAnimeManager3
        7z a -tzip -mx=9 "../myanimemanager3-${LATEST_COMMIT_DATE}-windows.zip" *

    - name: Creating portable zip before upload to release
      run: |
        cd dist/windows/MyAnimeManager3
        touch _internal/.portable
        7z a -tzip -mx=9 "../myanimemanager3-${LATEST_COMMIT_DATE}-windows-portable.zip" *

    - name: Upload file to release
      uses: softprops/action-gh-release@v2
      with:
        fail_on_unmatched_files: true
        files: |
          dist/windows/myanimemanager3-${{ env.LATEST_COMMIT_DATE }}-windows.zip
          dist/windows/myanimemanager3-${{ env.LATEST_COMMIT_DATE }}-windows-portable.zip
